name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check formatting with clang-format
        run: |
          git ls-files -z -- '*.cpp' '*.h' ':!extern/' ':!build/' \
            | xargs -0 -r uv run clang-format --dry-run --Werror

  build-test:
    runs-on: ubuntu-24.04
    env:
      IMAGE: slambot-dev-image:ci
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v4

      - name: Build dev image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image's container-user has uid 1000, but the runner's workspace is
      # owned by the runner user (uid 1001). Run the container as the runner
      # user, with HOME and CONAN_HOME inside the (gitignored) build/ folder.
      - name: Prepare container environment
        run: |
          mkdir -p build/home build/.conan2
          echo "RUN_IN_IMAGE=docker run --rm -u $(id -u):$(id -g) \
          -e HOME=$PWD/build/home -e CONAN_HOME=$PWD/build/.conan2 \
          -v $PWD:$PWD -w $PWD $IMAGE" >> "$GITHUB_ENV"

      - name: Restore Conan cache
        id: conan-cache
        uses: actions/cache/restore@v6
        with:
          path: build/.conan2
          key: conan-${{ runner.os }}-${{ hashFiles('conanfile.txt', 'conan/profiles/linux', 'conan.lock') }}

      - name: Install Conan packages
        run: |
          $RUN_IN_IMAGE bash -euo pipefail -c '
            uv sync --locked
            uv run conan profile detect --exist-ok
            uv run conan install . --profile=conan/profiles/linux \
              --lockfile=conan.lock --build=missing
            uv run conan cache clean "*"
          '

      # Saved right after the install, so a failing build or test does not
      # throw away the (slow) dependency build.
      - name: Save Conan cache
        if: steps.conan-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build/.conan2
          key: ${{ steps.conan-cache.outputs.cache-primary-key }}

      - name: Configure, build and test
        run: |
          $RUN_IN_IMAGE bash -euo pipefail -c '
            uv run cmake --preset conan-release
            uv run cmake --build --preset conan-release
            uv run ctest --preset conan-release --output-on-failure
          '
